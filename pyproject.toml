[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notionchat"
version = "0.4.0"
description = "OpenAI-compatible API proxy for Notion AI (cookie auth)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mughu-id" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "curl_cffi>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "pyright>=1.1.350",
]

[project.scripts]
notion = "notionchat.__main__:main"
notionchat = "notionchat.__main__:main"

[tool.setuptools.packages.find]
include = ["notionchat*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["notionchat"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.11"
reportMissingTypeStubs = false
